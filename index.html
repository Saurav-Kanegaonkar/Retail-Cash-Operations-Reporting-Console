<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retail Cash Operations Reporting Console</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Retail cash operations BI</p>
        <h1>Reporting Console</h1>
        <p class="lede">A scheduled reporting and Tableau Prep validation workbench for ATM, cash-management, field-service, and merchant support decisions.</p>
      </div>
      <div class="run-card">
        <span>Latest certified window</span>
        <strong>14 days</strong>
        <small>Daily huddle ready</small>
      </div>
    </header>

    <section class="metric-grid" id="metrics" aria-label="Report health metrics"></section>

    <nav class="tabs" aria-label="Console views">
      <button type="button" class="active" data-view="executive">Executive Pulse</button>
      <button type="button" data-view="exceptions">Exception Queue</button>
      <button type="button" data-view="prep">Prep Validation</button>
    </nav>

    <section id="view" class="view" aria-live="polite"></section>
  </main>
  <script src="src/data.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
